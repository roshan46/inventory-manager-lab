name: Build release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    if: vars.LAB_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: inventory-build-${{ github.sha }}
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-2
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Display safe OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
      
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + "audience=sts.amazonaws.com"
      
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )
      
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
      
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
      
          safe = {
              key: claims.get(key)
              for key in (
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "ref",
                  "job_workflow_ref",
              )
          }
          print(json.dumps(safe, indent=2))
          PY      
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          aws-region: us-east-2
      - name: Push tested source as immutable release
        shell: bash
        run: |
          set -euo pipefail
          registry="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker build --platform linux/amd64 -t "$ECR_REPOSITORY:$GITHUB_SHA" .
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"
          digest=$(aws ecr describe-images --repository-name inventory-manager --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          docker logout "$registry"
      - run: uv run python scripts/pipeline.py release
