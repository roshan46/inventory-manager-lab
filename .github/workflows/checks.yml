name: Checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab -d inventory_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv run pytest -q
      - run: uv run pytest tests/test_app.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lab:test-only@localhost:5432/inventory_test
      - run: uv run python scripts/check_materials.py
      - run: terraform fmt -check -recursive infra
      - name: Validate and test Terraform without AWS credentials
        shell: bash
        run: |
          for root in bootstrap dev state-lab; do
            terraform -chdir=infra/$root init -backend=false -input=false -lockfile=readonly
            terraform -chdir=infra/$root validate
            terraform -chdir=infra/$root test
          done
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck='' .github/workflows/*.yml
      - name: Test Docker lifecycle
        run: uv run python scripts/smoke_compose.py
      - name: Remove disposable test containers and volumes
        if: always()
        run: docker compose -p inventory-ci down --volumes --remove-orphans
