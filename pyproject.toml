[project]
name = "inventory-manager-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "flask-sqlalchemy>=3.1,<4", "psycopg[binary]>=3.2,<4", "gunicorn>=23,<24", "boto3>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "python-hcl2>=7,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
